# Número de worker processes
# auto = detecta automaticamente
worker_processes auto;

# PID file para gerenciar processos
pid /var/run/nginx.pid;

# Nível de logging (debug, info, notice, warn, error, crit, alert, emerg)
error_log /var/log/nginx/error.log info;

# Limite máximo de arquivo abertos por worker (requisições simultâneas)
# Cada conexão = 1 arquivo descriptor
worker_rlimit_nofile 65535;


# EVENTS CONTEXT - Configurações de conexão
# ============================================================================
events {
  # Número máximo de conexões simultâneas por worker
  # Total = worker_processes * worker_connections
  # Ex: 4 workers * 1024 = 4096 conexões simultâneas
  worker_connections 1024;

  # Método para detectar novas conexões
  use epoll;

  # Aceita múltiplas conexões de uma vez
  multi_accept on;
}


# HTTP CONTEXT - Protocolo HTTP
# ============================================================================
http {
  # ========================================================================
  # TIPOS MIME - O que cada arquivo representa
  # ========================================================================
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ========================================================================
  # LOGGING - Formato e localização
  # ========================================================================

  # Formato de log
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  '"$http_x_forwarded_for"';

  # Onde guardar os logs
  access_log /var/log/nginx/access.log main buffer=32k;

  # ========================================================================
  # PERFORMANCE TUNING
  # ========================================================================

  # Usa sendfile
  sendfile on;

  # Otimização específica para sendfile (agrupa headers + arquivo)
  tcp_nopush on;

  # Desabilita algoritmo de Nagle (reduz latência, importante para APIs)
  tcp_nodelay on;

  # Timeout para requisições inativas (proteção contra conexões mortas)
  keepalive_timeout 65;

  # Máximo de requisições HTTP/1.1 por conexão antes de fechar
  # HTTP/1.1 pode reusar conexões (connection pooling)
  keepalive_requests 100;

  # ========================================================================
  # SEGURANÇA - Headers e Limitações
  # ========================================================================

  # Esconde versão do Nginx
  server_tokens off;

  # Desabilita server side includes (SSI) por padrão
  ssi off;

  # Máximo tamanho de upload (proteção contra DoS)
  client_max_body_size 10m;

  # Timeout para ler headers da requisição (proteção contra slowloris)
  # Tempo máximo para cliente enviar headers
  client_header_timeout 20s;

  # Timeout para ler body completo
  client_body_timeout 20s;

  # Timeout para responder para cliente
  send_timeout 20s;

  # ========================================================================
  # GZIP COMPRESSION - Reduz tamanho de responses
  # ========================================================================

  gzip on;
  gzip_vary on;
  gzip_min_length 1000;  # Só comprime se > 1KB
  gzip_proxied any;      # Comprime mesmo respostas de upstream
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/json application/javascript;
  gzip_disable "msie6";  # Desabilita para IE6 (bugs)
  gzip_comp_level 6;     # 1-9: 1=rápido, 9=compacto (padrão=6)

  # ========================================================================
  # UPSTREAM - Define backends que serão protegidos
  # ========================================================================

  upstream backend {
    # O backend onde sua aplicação está rodando
    # IMPORTANTE: Na práxis, esse seria seu servidor de aplicação (API, Node, Python, etc)
    # Para testes locais, será um container Docker
    server backend:8080;  # backend = nome do container no docker-compose

    # Timeout para conectar ao backend (se não responder em 5s, tenta outro)
    connect_timeout 5s;

    # Timeout para ler resposta do backend
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  # ========================================================================
  # SERVER - Configuração do listener HTTP
  # ========================================================================

  server {
    # Porta em que Nginx escuta (usuários acessam aqui)
    listen 8080 default_server;
    listen [::]:8080 default_server;  # IPv6

    # Nome do servidor (domínio)
    # Pode ser múltiplos: server_name example.com www.example.com;
    server_name _;  # Aceita qualquer domínio (catch-all)

    # ====================================================================
    # ROTA PADRÃO - Roteia tudo para o backend
    # ====================================================================

    location / {
      # Tipo de proxy: http = requisição HTTP normal
      proxy_pass http://backend;

      # ================================================================
      # PROXY HEADERS - Informações sobre cliente original
      # ================================================================

      # Diz ao backend qual é o IP real do cliente
      # IMPORTANTE: Seu backend usa isso para logging/rate-limiting
      proxy_set_header X-Real-IP $remote_addr;

      # Cadeia de IPs pelos quais a requisição passou
      # Útil quando há múltiplos proxies
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Protocolo original (HTTP ou HTTPS)
      # Seu backend usa isso para gerar URLs corretos (redirects)
      proxy_set_header X-Forwarded-Proto $scheme;

      # Host original que cliente requisitou
      proxy_set_header Host $host;

      # Mantém conexão viva com backend (reutiliza conexões)
      proxy_set_header Connection "upgrade";
      proxy_set_header Upgrade $http_upgrade;

      # ================================================================
      # BUFFERING - Como Nginx lida com dados
      # ================================================================

      # IMPORTANTE PARA ModSecurity: buffering=on permite que ModSecurity
      # veja o corpo completo da requisição antes de passar para backend.
      # Se desabilitar (off), ModSecurity vê em chunks (menos seguro).
      proxy_buffering on;

      # Tamanho do buffer para headers da resposta do backend
      proxy_buffer_size 4k;

      # Número e tamanho dos buffers para corpo da resposta
      proxy_buffers 8 4k;

      # Tamanho de leitura por vez do backend
      proxy_read_timeout 10s;
    }

    # ====================================================================
    # ROTA DE HEALTH CHECK - Para load balancers
    # ====================================================================

    location /health {
      # Retorna 200 OK
      # Use em: docker health checks, Kubernetes probes, load balancers
      access_log off;  # Não loga health checks (muito noise)
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # ====================================================================
    # ROTA DE METRICS (Opcional) - Para observabilidade
    # ====================================================================

    location /metrics {
      # Stub status mostra estatísticas do Nginx
      # Ativa: nginx.conf precisa compilado com --with-http_stub_status_module
      stub_status on;
      access_log off;
    }

    # ====================================================================
    # NEGAR ACESSO A ARQUIVOS SENSÍVEIS
    # ====================================================================

    # Nega acesso a .git, .env, etc (camadas extras de proteção)
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    # Nega acesso a arquivos temporários
    location ~ ~$ {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
