# ============================================================================
# MODSECURITY CONFIGURATION - Web Application Firewall
# Focus: Security Rule Tuning and Learning
# ============================================================================

# ============================================================================
# 1. CORE SETTINGS - Configurações fundamentais
# ============================================================================

# SecRuleEngine: Como ModSecurity opera
# - On: Bloqueia requisições maliciosas (PROTECTION MODE)
# - Off: Desabilita ModSecurity
# - DetectionOnly: Loga tudo mas não bloqueia (LEARNING MODE)
SecRuleEngine On

# Ativa audit logging (registra TODAS as requisições analisadas)
SecAuditEngine On

# Formato do audit log
SecAuditLogFormat JSON

# ============================================================================
# 2. AUDIT LOGGING - Registro detalhado de requisições
# ============================================================================

# Onde guardar o audit log
SecAuditLog /var/log/modsecurity/audit.log

# Quais partes da requisição registrar
# A = Audit data (header geral)
# B = Request headers
# C = Request body
# D = Response headers
# E = Response body
# F = Extra data (timings, etc)
# H = Audit log header (meta-info)
# I = Chunk de requisição
# J = Chunk de resposta
# K = Final boundaries
# Valor: ABCDEFHIJK = tudo
SecAuditLogParts ABCDEFHIJK

# Máximo de partes a registrar por requisição (proteção contra logs gigantes)
SecAuditLogRelevantStatus "^(?:4|5)"

# Relevância: quando registrar?
# - 4 = erros 4xx (ex: 403 bloqueado, 400 bad request)
# - 5 = erros 5xx (ex: 500 erro no backend)
SecAuditLogRelevantStatus "^(?:2|3|4|5)"

# Máximo de bytes a registrar por requisição (evita logs gigantes de uploads)
# -1 = sem limite
SecAuditLogStorageDir /var/log/modsecurity/

# ============================================================================
# 3. CONFIGURAÇÕES DE PARSER - Como ModSecurity interpreta requisições
# ============================================================================

# Máximo tamanho de body que ModSecurity processa (proteção contra DoS)
# Se body > isso, passa sem analisar
# 10MB = 10485760 bytes
SecRequestBodyLimit 10485760

# Máximo de bytes de header (proteção contra headers gigantes)

# Processa uploads multipart/form-data
SecUploadDir /var/tmp/

# Proteção contra uploads maliciosos
SecUploadKeepFiles Off

# ============================================================================
# 4. SISTEMA DE VARIÁVEIS - Para correlacionar requisições
# ============================================================================

# ID único por transação (útil em logs para correlacionar req/resp)
SecStatusEngine On

# ============================================================================
# 5. CARREGA OWASP CRS (Core Rule Set) - Regras padrão de segurança
# ============================================================================

# O CRS é um conjunto profissional de regras mantido pela OWASP
# Inclui proteção contra:
# - SQL Injection
# - XSS (Cross-Site Scripting)
# - CSRF (Cross-Site Request Forgery)
# - RFI/LFI (Remote/Local File Inclusion)
# - E muito mais

# Arquivo de inicialização do CRS
Include /etc/modsecurity/crs/crs-setup.conf

# Regras padrão do CRS
Include /etc/modsecurity/crs/rules/*.conf

# ============================================================================
# 6. PARANOIA LEVEL - Sensibilidade de detecção
# ============================================================================

# Quanto mais alto, mais agressivo (mais false positives também)
# 1 = padrão (proteção boa, poucos falsos positivos)
# 2 = mais agressivo (melhor proteção, alguns falsos positivos)
# 3 = muito agressivo (proteção máxima, muitos falsos positivos)
# 4 = paranoia máxima (praticamente nada passa)
#
SecAction "id:900000,phase:1,nolog,pass,t:none,\
  setvar:tx.paranoia_level=2"

# ============================================================================
# 7. CUSTOM RULES - Suas próprias regras de proteção
# ============================================================================

# Exemplo 1: Bloqueia requisições sem User-Agent (bots/ferramentas)
# ID 1001: número único que identifica essa regra
# phase:2: após headers (info completa)
# deny: ação (bloqueia)
# log: registra
# status:403: retorna código 403 Forbidden
SecRule REQUEST_HEADERS:User-Agent "@eq" \
  "id:1001,phase:2,deny,log,status:403,\
   msg:'Requisição sem User-Agent detectada'"

# Exemplo 2: Protege contra DoS - máximo 10 requisições por IP em 60 segundos
# ip.1.0.0.0/0: qualquer IP
# block: bloqueia
# track: rastreia por IP
SecRule IP:@ipMatch "0.0.0.0/0" \
  "id:1002,phase:2,nolog,pass,\
   setvar:ip.dos_counter=+1,\
   expirevar:ip.dos_counter=60"

SecRule ip:dos_counter "@gt 10" \
  "id:1003,phase:2,deny,log,status:429,\
   msg:'Limite de taxa excedido (DoS)'"

# Kubernetes /health probes use a numeric IP in Host header; allow it explicitly
# to avoid false positives from CRS rule 920350 while keeping the rest of the app protected.
SecRule REQUEST_URI "@streq /health" \
  "id:1004,phase:1,nolog,allow"

# ============================================================================
# 8. CONFIGURAÇÕES ESPECÍFICAS DE DETECÇÃO
# ============================================================================

# Normaliza requests (remove encoding duplo, etc)
SecAction "id:900010,phase:1,nolog,pass,t:none,\
  setvar:tx.normalise_request_headers=1,\
  setvar:tx.normalise_uri=1"

# ============================================================================
# 9. LOGGING CUSTOMIZADO - Informa backend sobre bloqueios
# ============================================================================

# Passa informação ao backend sobre por que foi bloqueado
# Seu backend pode analisar isso para entender ataques
SecRule id "@eq 0" "phase:5,pass,log,\
  setenv:MODSECURITY_ACTION=passed"

SecRule MATCHED_RULE "@ne" "phase:5,pass,log,\
  setenv:MODSECURITY_ACTION=blocked"
