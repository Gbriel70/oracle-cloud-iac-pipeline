# ============================================================================
# PostgreSQL Configuration File
# Otimizações de segurança, performance e auditoria
# ============================================================================

# ============================================================================
# CONEXÕES E AUTENTICAÇÃO
# ============================================================================

# Escuta apenas internamente (Docker network)
listen_addresses = '*'

# Limite máximo de conexões
max_connections = 200
superuser_reserved_connections = 3

# Timeout de autenticação (60 segundos)
authentication_timeout = 60

# ============================================================================
# SEGURANÇA
# ============================================================================

# Ativa verificação de privilégios (padrão é on, mas explícito)
row_security = on

# Exige SSL/TLS em produção (comentado - configure via docker-compose env)
# ssl = on
# ssl_cert_file = '/var/lib/postgresql/server.crt'
# ssl_key_file = '/var/lib/postgresql/server.key'

# Força nova senha no próximo login (se necessário)
# password_encryption = 'scram-sha-256'

# ============================================================================
# PERFORMANCE - Memory
# ============================================================================

# Ajusta conforme disponibilidade de RAM do container
# shared_buffers: ~25% da RAM disponível (importante para cache)
shared_buffers = 256MB

# effective_cache_size: ~50-75% da RAM disponível
effective_cache_size = 1GB

# work_mem: RAM por operação de sorting/hash (~2-5MB por conexão)
work_mem = 4MB

# maintenance_work_mem: para VACUUM, CREATE INDEX, etc
maintenance_work_mem = 64MB

# ============================================================================
# PERFORMANCE - Disk I/O
# ============================================================================

# Usa random page access (on/off) - on é melhor para SSDs
random_page_cost = 1.1

# WAL (Write-Ahead Logging) - importante para durabilidade
wal_buffers = 16MB
default_statistics_target = 100
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ============================================================================
# REPLICAÇÃO E BACKUP (Se usar)
# ============================================================================

# Ativa WAL archiving (necessário para backup contínuo)
# wal_level = 'replica'
# max_wal_senders = 10
# max_replication_slots = 10
# hot_standby = on

# ============================================================================
# LOGGING - Essencial para auditoria e debugging
# ============================================================================

# Diretório de logs
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB

# Nível de logging
log_min_messages = warning
log_min_error_statement = error

# Log de statements (cuidado: pode impactar performance)
# log_statement = 'all'  # Loga todas as queries
log_statement = 'ddl'    # Loga apenas DDL (CREATE, ALTER, DROP)

# Log de transações longas (>1 segundo)
log_min_duration_statement = 1000

# Log de conexões e desconexões
log_connections = on
log_disconnections = on
log_duration = off

# Log de autenticação
log_authentication_attempts = on

# Formato do log
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# ============================================================================
# VACUUM E MAINTENANCE
# ============================================================================

# Autovacuum - limpa espaço não utilizado
autovacuum = on
autovacuum_naptime = 10s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1

# ============================================================================
# LOCKS E TIMEOUTS
# ============================================================================

# Timeout de transações (em ms) - evita locks indefinidos
# statement_timeout = 300000  # 5 minutos
# idle_in_transaction_session_timeout = 600000  # 10 minutos

# Lock timeout - erro se não conseguir lock em 30s
# lock_timeout = 30000

# ============================================================================
# PLANNER
# ============================================================================

# Ajuda o otimizador de query a fazer melhores planos
join_collapse_limit = 12
from_collapse_limit = 12

# ============================================================================
# SHARED PRELOAD LIBRARIES (Extensões)
# ============================================================================

# Auto explain (loga planos de query slow)
# shared_preload_libraries = 'auto_explain'
# auto_explain.log_min_duration = 5000  # > 5 segundos

# ============================================================================
# NOTAS DE CONFIGURAÇÃO PARA DOCKER
# ============================================================================

# Essas settings podem ser overridden via:
# 1. docker-compose.yml environment variables
# 2. POSTGRES_INITDB_ARGS
# 3. Command line do postgres quando inicia

# Exemplo no docker-compose:
# environment:
#   - POSTGRES_INITDB_ARGS=-c max_connections=500 -c shared_buffers=512MB
