services:
  postgres:
    build:
      context: ./docker_srcs/postgres
      dockerfile: Dockerfile
    container_name: postgres
    secrets:
      - postgres_db
      - postgres_user
      - postgres_password
      - postgres_init_db_args
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
    networks:
      - database_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    build:
      context: ./docker_srcs/vault
      dockerfile: Dockerfile
    container_name: vault
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
    secrets:
      - postgres_prod_user
      - postgres_prod_password
      - postgres_prod_host
      - postgres_prod_port
      - postgres_prod_database
      - postgres_dev_user
      - postgres_dev_password
      - postgres_dev_host
      - postgres_dev_port
      - postgres_dev_database
      - sendgrid_api_key
      - sendgrid_from_email
    networks:
      - vault_net
      - database_net
    restart: unless-stopped

  nginx:
    build:
      context: ./docker_srcs/nginx
      dockerfile: Dockerfile
    container_name: nginx
    depends_on:
      - vault
    volumes:
      # Configs estão no Dockerfile (COPY), não precisa volume mount
      - nginx_logs:/var/log/nginx
      - modsecurity_logs:/var/log/modsecurity
    networks:
      - proxy_net
      - app_net
    restart: unless-stopped

networks:
  proxy_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

  vault_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

  database_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16

volumes:
  postgres_data:
    driver: local

  postgres_logs:
    driver: local

  nginx_logs:
    driver: local

  modsecurity_logs:
    driver: local

secrets:
  postgres_prod_user:
    file: ./secrets/vault/postgres_prod_user.txt
  postgres_prod_password:
    file: ./secrets/vault/postgres_prod_password.txt
  postgres_prod_host:
    file: ./secrets/vault/postgres_prod_host.txt
  postgres_prod_port:
    file: ./secrets/vault/postgres_prod_port.txt
  postgres_prod_database:
    file: ./secrets/vault/postgres_prod_database.txt
  postgres_dev_user:
    file: ./secrets/vault/postgres_dev_user.txt
  postgres_dev_password:
    file: ./secrets/vault/postgres_dev_password.txt
  postgres_dev_host:
    file: ./secrets/vault/postgres_dev_host.txt
  postgres_dev_port:
    file: ./secrets/vault/postgres_dev_port.txt
  postgres_dev_database:
    file: ./secrets/vault/postgres_dev_database.txt
  sendgrid_api_key:
    file: ./secrets/vault/sendgrid_api_key.txt
  sendgrid_from_email:
    file: ./secrets/vault/sendgrid_from_email.txt
  postgres_db:
    file: ./secrets/postgres/postgres_db.txt
  postgres_user:
    file: ./secrets/postgres/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres/postgres_password.txt
  postgres_init_db_args:
    file: ./secrets/postgres/postgres_init_db_args.txt