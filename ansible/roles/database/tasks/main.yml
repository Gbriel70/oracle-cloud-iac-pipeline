---
- name: Verificar filesystem no volume de dados
  ansible.builtin.command: "blkid -o value -s TYPE {{ postgresql_data_device }}"
  register: postgresql_volume_filesystem
  changed_when: false
  failed_when: false

- name: Criar filesystem ext4 no volume quando estiver vazio
  ansible.builtin.command: "mkfs.ext4 {{ postgresql_data_device }}"
  when: postgresql_volume_filesystem.stdout | trim == ""

- name: Montar volume persistente do PostgreSQL
  ansible.builtin.mount:
    path: "{{ postgresql_data_mount_point }}"
    src: "{{ postgresql_data_device }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted

- name: Garantir permissões do diretório de dados após montagem
  ansible.builtin.file:
    path: "{{ postgresql_data_mount_point }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Instalar PostgreSQL e dependências Python para o Ansible
  ansible.builtin.apt:
    name:
      - postgresql-14
      - postgresql-contrib
      - postgresql-client
      - python3-psycopg2
    state: present
    update_cache: true

- name: Garantir que o PostgreSQL esteja ativo
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Permitir acesso remoto ao PostgreSQL
  ansible.builtin.lineinfile:
    path: /etc/postgresql/14/main/postgresql.conf
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = '*'"
  notify: Reiniciar PostgreSQL

- name: Autorizar conexões da rede do cluster
  ansible.builtin.lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    insertafter: EOF
    line: "host    all             all             10.0.0.0/16            scram-sha-256"
  notify: Reiniciar PostgreSQL

- name: Verificar se o usuário da aplicação existe
  ansible.builtin.command: "psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='{{ postgresql_user }}'\""
  register: postgresql_user_exists
  changed_when: false
  failed_when: false
  become_user: postgres

- name: Criar usuário da aplicação
  community.postgresql.postgresql_user:
    name: "{{ postgresql_user }}"
    password: "{{ postgresql_password }}"
    state: present
  become: true
  become_user: postgres
  no_log: true
  when: postgresql_user_exists.stdout | trim != "1"

- name: Verificar se o banco da aplicação existe
  ansible.builtin.command: "psql -tAc \"SELECT 1 FROM pg_database WHERE datname='{{ postgresql_database_name }}'\""
  register: postgresql_database_exists
  changed_when: false
  failed_when: false
  become_user: postgres

- name: Criar banco da aplicação
  community.postgresql.postgresql_db:
    name: "{{ postgresql_database_name }}"
    owner: "{{ postgresql_user }}"
    state: present
  become: true
  become_user: postgres
  when: postgresql_database_exists.stdout | trim != "1"

- name: Garantir privilégios do usuário no banco
  ansible.builtin.command: "psql -c \"GRANT ALL PRIVILEGES ON DATABASE {{ postgresql_database_name }} TO {{ postgresql_user }}\""
  changed_when: false
  become_user: postgres
