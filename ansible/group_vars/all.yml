project_name: devopsec-pipeline
os_packages:
  - curl
  - vim
  - unzip
  - ca-certificates
  - gnupg
  - lsb-release
  - apt-transport-https
  - software-properties-common
  - python3
  - python3-pip
  - python3-venv
  - chrony

kubernetes_version: "1.30"
k3s_version: "v1.30.4+k3s1"
package_architecture: >-
  {{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}
