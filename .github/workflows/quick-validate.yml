name: Quick Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🧰 Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: 🧪 Validar Terraform
        working-directory: terraform
        run: |
          terraform init -input=false -backend=false
          terraform fmt -check
          terraform validate
          echo "✅ Terraform validado"

      - name: 📋 Validar Docker Compose
        run: |
          # Garante a existência da pasta de secrets temporária para o Compose validar
          mkdir -p secrets/postgres secrets/vault secrets/nginx
          touch secrets/postgres/postgres_db.txt \
                secrets/postgres/postgres_user.txt \
                secrets/postgres/postgres_password.txt \
                secrets/postgres/postgres_init_db_args.txt

          # Busca o docker-compose.yml no caminho atual ou em docker_srcs/
          COMPOSE_FILE=$(find . -maxdepth 2 -name "docker-compose.yml" | head -n 1)

          if [ -n "$COMPOSE_FILE" ]; then
            echo "Avaliando $COMPOSE_FILE..."
            docker compose -f "$COMPOSE_FILE" config --quiet
            echo "✅ Docker Compose válido"
          else
            echo "❌ Nenhum docker-compose.yml encontrado"
            exit 1
          fi