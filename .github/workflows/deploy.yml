name: Continuous Integration & Deployment

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔤 Converter nome do repositório e usuário para minúsculas
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Suporte a emulação para gerar binários AMD64 e ARM64 na mesma pipeline
      - name: 🐳 Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push Multi-Arch: Nginx
      - name: 🐳 Build e Push - Nginx
        uses: docker/build-push-action@v5
        with:
          context: ./docker_srcs/nginx
          file: ./docker_srcs/nginx/Dockerfile
          platforms: linux/amd64,linux/arm64  # <-- MULTI-ARQUITETURA
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/nginx:latest
            ghcr.io/${{ env.REPO_LOWER }}/nginx:${{ github.sha }}

      # 2. Build & Push Multi-Arch: Postgres
      - name: 🐳 Build e Push - Postgres
        uses: docker/build-push-action@v5
        with:
          context: ./docker_srcs/postgres
          file: ./docker_srcs/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64  # <-- MULTI-ARQUITETURA
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/postgres:latest
            ghcr.io/${{ env.REPO_LOWER }}/postgres:${{ github.sha }}

      # 3. Build & Push Multi-Arch: Vault
      - name: 🐳 Build e Push - Vault
        uses: docker/build-push-action@v5
        with:
          context: ./docker_srcs/vault
          file: ./docker_srcs/vault/Dockerfile
          platforms: linux/amd64,linux/arm64  # <-- MULTI-ARQUITETURA
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/vault:latest
            ghcr.io/${{ env.REPO_LOWER }}/vault:${{ github.sha }}

      # 4. Configurar SSH e Kubeconfig
      - name: 🔑 Configurar Chave SSH para o Bastion
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: ⚙️ Configurar Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # 5. Injetar a tag do commit dinamicamente nos manifestos
      - name: 📝 Substituir tag :latest pelo SHA do commit
        run: |
          sed -i "s|:latest|:${{ github.sha }}|g" k8s/*.yaml

      # 6. Aplicação no K3s
      - name: 🚀 Estabelecer Túnel SSH e Aplicar Manifestos no K3s
        run: |
          ssh -o StrictHostKeyChecking=no -f -N -L 6443:${{ secrets.K8S_NODE_IP }}:6443 ubuntu@${{ secrets.BASTION_IP }}
          
          kubectl --server=https://127.0.0.1:6443 --insecure-skip-tls-verify create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ env.ACTOR_LOWER }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl --server=https://127.0.0.1:6443 --insecure-skip-tls-verify apply -f -

          kubectl --server=https://127.0.0.1:6443 --insecure-skip-tls-verify apply -f k8s/
          kubectl --server=https://127.0.0.1:6443 --insecure-skip-tls-verify rollout status deployment/app-web --timeout=120s

      # 7. Diagnóstico em Caso de Falha
      - name: 🔍 Diagnóstico em Caso de Falha
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no -f -N -L 6443:${{ secrets.K8S_NODE_IP }}:6443 ubuntu@${{ secrets.BASTION_IP }} || true
          echo "=== 📌 LISTA DE PODS ==="
          kubectl --server=https://127.0.0.1:6443 --insecure-skip-tls-verify get pods
          echo "=== 📌 DESCRIÇÃO DOS PODS (EVENTOS) ==="
          kubectl --server=https://127.0.0.1:6443 --insecure-skip-tls-verify describe pods
          echo "=== 📌 LOGS DOS CONTAINERS ==="
          kubectl --server=https://127.0.0.1:6443 --insecure-skip-tls-verify logs -l app=app-web --tail=50 || true