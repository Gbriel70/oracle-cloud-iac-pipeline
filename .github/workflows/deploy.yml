name: Continuous Integration & Deployment

on:
  push:
    branches: [ main ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔤 Converter nome do repositório e usuário para minúsculas
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Suporte a emulação para gerar binários AMD64 e ARM64 na mesma pipeline
      - name: 🐳 Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push Multi-Arch: Nginx
      - name: 🐳 Build e Push - Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./docker_srcs/nginx
          file: ./docker_srcs/nginx/Dockerfile
          platforms: linux/amd64,linux/arm64  # <-- MULTI-ARQUITETURA
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/nginx:latest
            ghcr.io/${{ env.REPO_LOWER }}/nginx:${{ github.sha }}

      # 2. Build & Push Multi-Arch: API
      - name: 🐳 Build e Push - API
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/api:latest
            ghcr.io/${{ env.REPO_LOWER }}/api:${{ github.sha }}

      # 3. Build & Push Multi-Arch: Postgres
      - name: 🐳 Build e Push - Postgres
        uses: docker/build-push-action@v6
        with:
          context: ./docker_srcs/postgres
          file: ./docker_srcs/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64  # <-- MULTI-ARQUITETURA
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/postgres:latest
            ghcr.io/${{ env.REPO_LOWER }}/postgres:${{ github.sha }}

      # 4. Build & Push Multi-Arch: Vault
      - name: 🐳 Build e Push - Vault
        uses: docker/build-push-action@v6
        with:
          context: ./docker_srcs/vault
          file: ./docker_srcs/vault/Dockerfile
          platforms: linux/amd64,linux/arm64  # <-- MULTI-ARQUITETURA
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/vault:latest
            ghcr.io/${{ env.REPO_LOWER }}/vault:${{ github.sha }}

      # 5. Configurar SSH e Kubeconfig
      - name: 🔑 Configurar Chave SSH para o Bastion
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: ⚙️ Configurar Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # 6. Atualizar tags das imagens GHCR para o SHA do commit
      - name: 📝 Ajustar tags das imagens no diretório k8s
        run: |
          sed -E -i "s|ghcr.io/[^[:space:]]+/nginx:[A-Za-z0-9._-]+|ghcr.io/${{ env.REPO_LOWER }}/nginx:${{ github.sha }}|g" k8s/*.yaml
          sed -E -i "s|ghcr.io/[^[:space:]]+/api:[A-Za-z0-9._-]+|ghcr.io/${{ env.REPO_LOWER }}/api:${{ github.sha }}|g" k8s/*.yaml

      # 7. Aplicação no K3s
      - name: 🚀 Estabelecer Túnel SSH e Aplicar Manifestos no K3s
        run: |
          LOCAL_K8S_PORT=6444

          if command -v lsof >/dev/null 2>&1; then
            lsof -ti tcp:${LOCAL_K8S_PORT} | xargs -r kill -9 || true
          else
            ss -ltnp "sport = :${LOCAL_K8S_PORT}" 2>/dev/null | awk 'NR>1 {print $NF}' | sed 's/.*pid=//; s/,.*//' | xargs -r kill -9 || true
          fi

          ssh -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes -f -N -L 127.0.0.1:${LOCAL_K8S_PORT}:${{ secrets.K8S_NODE_IP }}:6443 ubuntu@${{ secrets.BASTION_IP }}

          export KUBECONFIG="$HOME/.kube/config"
          kubectl --server=https://127.0.0.1:${LOCAL_K8S_PORT} --insecure-skip-tls-verify create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ env.ACTOR_LOWER }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl --server=https://127.0.0.1:${LOCAL_K8S_PORT} --insecure-skip-tls-verify apply -f -

          kubectl --server=https://127.0.0.1:${LOCAL_K8S_PORT} --insecure-skip-tls-verify create secret generic app-secrets \
            --from-literal=POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --from-literal=POSTGRES_DB='${{ secrets.POSTGRES_DB }}' \
            --dry-run=client -o yaml | kubectl --server=https://127.0.0.1:${LOCAL_K8S_PORT} --insecure-skip-tls-verify apply -f -

          kubectl --server=https://127.0.0.1:${LOCAL_K8S_PORT} --insecure-skip-tls-verify apply -f k8s/
          kubectl --server=https://127.0.0.1:${LOCAL_K8S_PORT} --insecure-skip-tls-verify set image deployment/app-web web=ghcr.io/${{ env.REPO_LOWER }}/nginx:${{ github.sha }}
          kubectl --server=https://127.0.0.1:${LOCAL_K8S_PORT} --insecure-skip-tls-verify set image deployment/api-backend api=ghcr.io/${{ env.REPO_LOWER }}/api:${{ github.sha }}
          kubectl --server=https://127.0.0.1:${LOCAL_K8S_PORT} --insecure-skip-tls-verify rollout status deployment/app-web --timeout=180s
          kubectl --server=https://127.0.0.1:${LOCAL_K8S_PORT} --insecure-skip-tls-verify rollout status deployment/api-backend --timeout=180s
          kubectl --server=https://127.0.0.1:${LOCAL_K8S_PORT} --insecure-skip-tls-verify rollout status statefulset/postgres --timeout=180s

      # 8. Diagnóstico em Caso de Falha
      - name: 🔍 Diagnóstico em Caso de Falha
        if: failure()
        run: |
          echo "=== 📌 LISTA DE PODS ==="
          kubectl --server=https://127.0.0.1:6444 --insecure-skip-tls-verify get pods || true
          echo "=== 📌 DESCRIÇÃO DOS PODS (EVENTOS) ==="
          kubectl --server=https://127.0.0.1:6444 --insecure-skip-tls-verify describe pods || true
          echo "=== 📌 LOGS DOS CONTAINERS ==="
          kubectl --server=https://127.0.0.1:6444 --insecure-skip-tls-verify logs -l app=app-web --tail=50 || true